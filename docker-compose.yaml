services:
  db:
    container_name: savya-app
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - 5430:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: savyaDB
    volumes:
      # Volumen administrado por Docker: datos persistentes
      - postgres_data_savya:/var/lib/postgresql/data
      # Bind mount: scripts SQL del proyecto
      # - ./postgres/init:/docker-entrypoint-initdb.d:ro
  mailpit:
    container_name: mailpit
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailpit_data:/data
      
volumes:
  postgres_data_savya:
    driver: local
  mailpit_data:
    driver: local