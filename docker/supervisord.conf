[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
priority=10
autorestart=true

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autorestart=true

[program:queue]
command=php /var/www/html/artisan queue:work database --sleep=3 --tries=3 --timeout=90
user=www-data
priority=30
autorestart=true
